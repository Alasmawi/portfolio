<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The hero's data path in miniature: three hops on a trace, the gateway in
         amber, ending in the teal "live" dot. Drawn by scripts/make-icons.mjs
         from the site's palette. SVG where the browser takes it, PNG where it
         doesn't (Safari); the touch icon is a full square because iOS rounds
         it. The frozen /v1 keeps its own favicon-*.png. -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- First person, and it names what the work is and where it was done. -->
    <meta name="description" content="Software engineer in Bahrain. I build full-stack products and run them on AWS. Most recently, the Ministry of Interior K9 Unit's monitoring platform at the AWS Cloud Innovation Center, and a bilingual obligations registry for the Shura Council." />
    <meta name="theme-color" content="#1c0810" />
    <title>Abdulla Alasmawi · Software engineer, full-stack and cloud</title>

    <!-- Link previews. There were none: pasting the site into LinkedIn, a job
         application or a WhatsApp message produced a bare URL with no title,
         no description and no image — on a site whose main distribution is a
         pasted link. og:image is absolute because preview crawlers do not
         resolve relative URLs. The card is generated from the site's own
         tokens by scripts/make-og.mjs. -->
    <link rel="canonical" href="https://alasmawi.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://alasmawi.dev/" />
    <meta property="og:site_name" content="alasmawi.dev" />
    <meta property="og:title" content="Abdulla Alasmawi · Software engineer, full-stack and cloud" />
    <meta property="og:description" content="I build full-stack products and run them on AWS. Most recently: the Ministry of Interior K9 Unit's monitoring platform, and a bilingual registry for the Shura Council." />
    <meta property="og:image" content="https://alasmawi.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Abdulla Alasmawi · Software engineer, full-stack and cloud" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Abdulla Alasmawi · Software engineer, full-stack and cloud" />
    <meta name="twitter:description" content="I build full-stack products and run them on AWS. Most recently: the Ministry of Interior K9 Unit's monitoring platform, and a bilingual registry for the Shura Council." />
    <meta name="twitter:image" content="https://alasmawi.dev/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
