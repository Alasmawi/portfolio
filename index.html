<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Circuit-board mark. PNG rather than the animated GIF: Chrome only ever
         shows a GIF favicon's first frame, and the GIF is 374kB against 1.4kB
         here. The site background is baked in so the light strokes stay visible
         on a light tab strip. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- First person, and it names the one thing worth naming. The old copy
         was "Cloud Computing, AWS, IoT & Backend Development" — four nouns in
         a row, which is the CV voice the rest of the site avoids. -->
    <meta name="description" content="I build full-stack systems on AWS. I wrote the cloud backend for the Bahrain Ministry of Interior's police K9 monitoring system — sensors on a collar, MQTT to IoT Core, alerts on one dashboard." />
    <meta name="theme-color" content="#17121a" />
    <title>Abdulla Alasmawi — full-stack on AWS</title>

    <!-- Link previews. There were none: pasting the site into LinkedIn, a job
         application or a WhatsApp message produced a bare URL with no title,
         no description and no image — on a site whose main distribution is a
         pasted link. og:image is absolute because preview crawlers do not
         resolve relative URLs. The card is generated from the site's own
         tokens by scripts/make-og.mjs. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://alasmawi.dev/v2/" />
    <meta property="og:site_name" content="alasmawi.dev" />
    <meta property="og:title" content="Abdulla Alasmawi — full-stack on AWS" />
    <meta property="og:description" content="I build full-stack systems on AWS. I wrote the cloud backend for the Bahrain Ministry of Interior's police K9 monitoring system." />
    <meta property="og:image" content="https://alasmawi.dev/v2/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Abdulla Alasmawi — full-stack on AWS" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Abdulla Alasmawi — full-stack on AWS" />
    <meta name="twitter:description" content="I build full-stack systems on AWS. I wrote the cloud backend for the Bahrain Ministry of Interior's police K9 monitoring system." />
    <meta name="twitter:image" content="https://alasmawi.dev/v2/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
